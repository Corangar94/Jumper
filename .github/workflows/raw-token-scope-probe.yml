name: Raw Token Scope Probe

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/raw-token-scope-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe empty private relay token credential scope
        shell: bash
        env:
          TOKEN: AJR4IISK4VTDTFP76YY4EKTKRXGDLAA
        run: |
          set -u
          probe() {
            label="$1"
            shift
            code="$(curl --silent --show-error --location --output "${label}.out" --write-out '%{http_code}' "$@" || true)"
            bytes="$(wc -c < "${label}.out" 2>/dev/null || echo 0)"
            digest="$(sha256sum "${label}.out" 2>/dev/null | cut -d' ' -f1 || true)"
            printf '%s code=%s bytes=%s sha256=%s\n' "$label" "$code" "$bytes" "$digest"
            head -c 120 "${label}.out" 2>/dev/null | tr '\n' ' '; echo
          }
          probe exact_raw "https://raw.githubusercontent.com/Corangar94/FPS/master/probe-a.txt?token=${TOKEN}"
          probe api_header -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Corangar94/FPS/contents/probe-b.txt?ref=master"
          probe archive_header -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Corangar94/FPS/zipball/master"
          set +e
          GIT_TERMINAL_PROMPT=0 git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Corangar94/FPS.git" fps-clone >clone.out 2>&1
          clone_code=$?
          set -e
          printf 'git_clone exit=%s\n' "$clone_code"
          sed -E 's#https://x-access-token:[^@]+@#https://x-access-token:REDACTED@#g' clone.out | head -20
          if [ -d fps-clone/.git ]; then git -C fps-clone rev-parse HEAD; fi
