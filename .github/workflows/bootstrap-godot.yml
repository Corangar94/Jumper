name: Bootstrap Godot 4.6.3 Binary

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/bootstrap-godot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-godot:
    name: Package verified Linux editor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: false

      - name: Verify and stage binary
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee godot-version.txt
          binary="$(command -v godot)"
          cp --dereference "$binary" Godot_v4.6.3-stable_linux.x86_64
          chmod +x Godot_v4.6.3-stable_linux.x86_64
          sha256sum Godot_v4.6.3-stable_linux.x86_64 | tee godot-binary.sha256
          file Godot_v4.6.3-stable_linux.x86_64 | tee godot-binary.file.txt

      - name: Upload verified binary
        uses: actions/upload-artifact@v4
        with:
          name: godot-4.6.3-linux-x86_64
          path: |
            Godot_v4.6.3-stable_linux.x86_64
            godot-version.txt
            godot-binary.sha256
            godot-binary.file.txt
          if-no-files-found: error
          retention-days: 1
